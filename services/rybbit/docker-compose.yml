# Statistiques de visite (Rybbit, images officielles, sans dépôt propre : versionné dans /opt).
# Adapté de https://github.com/rybbit-io/rybbit/blob/master/docker-compose.yml : sans son Caddy
# intégré (le proxy partagé s'en charge) et sans aucun port publié.
#
# Seuls « backend » (/api/*) et « client » (tableau de bord) rejoignent le réseau proxy ; les
# bases restent sur le réseau default du projet. Chaque service porte un alias rybbit-* : le
# backend étant AUSSI sur le réseau proxy, un nom générique (postgres, redis…) y serait ambigu.
name: rybbit

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging: *logging

services:
  clickhouse:
    <<: *hardening
    image: clickhouse/clickhouse-server:26.3.17.4 # version de l'upstream ; ne pas suivre « latest »
    volumes:
      - clickhouse:/var/lib/clickhouse
    configs:
      - source: clickhouse_network
        target: /etc/clickhouse-server/config.d/network.xml
      - source: clickhouse_logging
        target: /etc/clickhouse-server/config.d/logging_rules.xml
      - source: clickhouse_resource_limits
        target: /etc/clickhouse-server/config.d/resource_limits.xml
      # Les réglages de profil ne sont lus que depuis users.d
      - source: clickhouse_user_settings
        target: /etc/clickhouse-server/users.d/user_settings.xml
    environment:
      CLICKHOUSE_DB: analytics
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?manquant dans .env}
      # Permet au backend de créer l'utilisateur restreint « rybbit_query » au démarrage
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    networks:
      default:
        aliases:
          - rybbit-clickhouse
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  postgres:
    <<: *hardening
    image: postgres:17 # majeure figée : un changement de majeure exige un dump/restore
    environment:
      POSTGRES_USER: rybbit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?manquant dans .env}
      POSTGRES_DB: analytics
    volumes:
      - postgres:/var/lib/postgresql/data
    networks:
      default:
        aliases:
          - rybbit-postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rybbit -d analytics"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    <<: *hardening
    image: redis:8-alpine
    # Sessions, identité, compteurs anti-robots : noeviction + AOF (comme l'upstream)
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?manquant dans .env}
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis:/data
    networks:
      default:
        aliases:
          - rybbit-redis
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  backend:
    <<: *hardening
    image: ghcr.io/rybbit-io/rybbit-backend:${RYBBIT_VERSION:-v2.9.0}
    environment:
      NODE_ENV: production
      BASE_URL: ${BASE_URL:?manquant dans .env}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?manquant dans .env}
      DISABLE_SIGNUP: ${DISABLE_SIGNUP:-false}
      DISABLE_TELEMETRY: ${DISABLE_TELEMETRY:-true}
      MAPBOX_TOKEN: ${MAPBOX_TOKEN:-}
      CLUSTER_WORKERS: ${CLUSTER_WORKERS:-2}
      CLICKHOUSE_HOST: http://rybbit-clickhouse:8123
      CLICKHOUSE_DB: analytics
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_QUERY_PASSWORD: ${CLICKHOUSE_PASSWORD}
      POSTGRES_HOST: rybbit-postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: analytics
      POSTGRES_USER: rybbit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: rybbit-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      clickhouse:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      default: {}
      proxy:
        aliases:
          - rybbit-backend # cible du reverse_proxy /api/* dans ./Caddyfile
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3001/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  client:
    <<: *hardening
    image: ghcr.io/rybbit-io/rybbit-client:${RYBBIT_VERSION:-v2.9.0}
    # Pas de healthcheck (aucun dans l'upstream) : scripts/app-deploy.sh vérifie qu'il reste
    # « running » quelques secondes après le démarrage.
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_BACKEND_URL: ${BASE_URL}
      NEXT_PUBLIC_DISABLE_SIGNUP: ${DISABLE_SIGNUP:-false}
    depends_on:
      - backend
    networks:
      default: {}
      proxy:
        aliases:
          - rybbit-client # cible du reverse_proxy par défaut dans ./Caddyfile

networks:
  default: {}
  proxy:
    external: true
    name: ${PROXY_NETWORK:-proxy}

volumes:
  clickhouse:
  postgres:
  redis:

configs:
  clickhouse_network:
    content: |
      <clickhouse>
          <listen_host>0.0.0.0</listen_host>
      </clickhouse>

  # Supprime les journaux système de ClickHouse, qui grossissent sans fin sinon
  clickhouse_logging:
    content: |
      <clickhouse>
        <logger>
            <level>warning</level>
            <console>true</console>
        </logger>
        <query_thread_log remove="remove"/>
        <query_log remove="remove"/>
        <query_views_log remove="remove"/>
        <query_metric_log remove="remove"/>
        <error_log remove="remove"/>
        <opentelemetry_span_log remove="remove"/>
        <text_log remove="remove"/>
        <trace_log remove="remove"/>
        <metric_log remove="remove"/>
        <asynchronous_metric_log remove="remove"/>
        <session_log remove="remove"/>
        <part_log remove="remove"/>
        <latency_log remove="remove"/>
        <processors_profile_log remove="remove"/>
      </clickhouse>

  # VPS partagé avec les autres apps : ClickHouse plafonné à 40 % de la RAM (upstream : 80 %).
  clickhouse_resource_limits:
    content: |
      <clickhouse>
        <max_server_memory_usage_to_ram_ratio>0.40</max_server_memory_usage_to_ram_ratio>
        <concurrent_threads_soft_limit_ratio_to_cores>1</concurrent_threads_soft_limit_ratio_to_cores>
        <merges_mutations_memory_usage_to_ram_ratio>0.15</merges_mutations_memory_usage_to_ram_ratio>
      </clickhouse>

  clickhouse_user_settings:
    content: |
      <clickhouse>
        <profiles>
          <default>
            <enable_json_type>1</enable_json_type>
            <async_insert>1</async_insert>
            <wait_for_async_insert>1</wait_for_async_insert>
            <log_queries>0</log_queries>
            <log_query_threads>0</log_query_threads>
            <log_processors_profiles>0</log_processors_profiles>
          </default>
        </profiles>
      </clickhouse>
